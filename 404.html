<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Laar Fragrance</title>
    <meta name="robots" content="noindex">
    <script>
        var m = location.pathname.match(/^\/blog\/([a-z0-9-]+)\.html$/i);
        if (m) {
            location.replace("/article.html?slug=" + m[1]);
        }
    </script>
</head>
<body>
    <p>Page not found.</p>
    <p><a href="/index.html">Go to homepage</a></p>
</body>
</html>
