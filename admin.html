<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Laar Fragrance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="admin-login">

        <h1>Laar Fragrance</h1>

        <h2>Admin Login</h2>

        <input
            type="email"
            id="adminEmail"
            placeholder="Admin Email">

        <input
            type="password"
            id="adminPassword"
            placeholder="Password">

        <button
            type="button"
            onclick="adminLogin()">

            LOGIN

        </button>

        <p id="loginMessage"></p>

    </main>


    <script src="script.js"></script>

</body>

</html>
