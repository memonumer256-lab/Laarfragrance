name: Generate blog pages

on:
  schedule:
    - cron: "0 */6 * * *"   # har 6 ghante baad khud chalega
  workflow_dispatch:         # GitHub main "Run workflow" button se bhi chal sakta hai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate static blog pages and sitemap
        run: node generate-blog.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A blog sitemap.xml
          git diff --cached --quiet || (git commit -m "Update blog pages" && git push)

